name: Always be deploying

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
  push:
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
    branches:
      - main
    tags:
      - "*.*.*"

jobs:
  aot-validate:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: ArghAotSmoketest
          - runner: macos-latest
            binary: ArghAotSmoketest
          - runner: windows-latest
            binary: ArghAotSmoketest.exe
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json
    - name: Publish AOT
      run: dotnet publish examples/ArghAotSmoketest/ArghAotSmoketest.csproj -c Release
    - name: Invoke AOT
      shell: bash
      run: ./.artifacts/publish/ArghAotSmoketest/release/${{ matrix.binary }} __schema
    - name: Report AOT binary size
      shell: bash
      run: |
        BYTES=$(wc -c < ./.artifacts/publish/ArghAotSmoketest/release/${{ matrix.binary }})
        echo "AOT binary size: $BYTES bytes ($((BYTES / 1024)) KB)"
        echo "### AOT binary size (${{ matrix.runner }})" >> "$GITHUB_STEP_SUMMARY"
        echo "$BYTES bytes ($((BYTES / 1024)) KB)" >> "$GITHUB_STEP_SUMMARY"

  schema-conformance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json
    - name: Build test CLI host
      run: dotnet build -c Release tests/Nullean.Argh.Tests.CliHost/
    - name: Capture __schema output
      run: ./.artifacts/bin/Nullean.Argh.Tests.CliHost/release/Nullean.Argh.Tests.CliHost __schema > /tmp/argh-schema-output.json
    - name: Download cli-schema meta-schema
      run: curl -fsSL https://raw.githubusercontent.com/cli-schema/cli-schema/main/schema/cli-schema.meta-schema.json -o /tmp/cli-schema.meta-schema.json
    - name: Validate against cli-schema v1 meta-schema
      run: npx --yes ajv-cli validate -s /tmp/cli-schema.meta-schema.json -d /tmp/argh-schema-output.json --spec=draft2020

  # Runs the test suite on every platform; the build job, which also packages and publishes, still tests on Linux too.
  # Windows encodes console output in the console code page, so the Windows tests run under the code pages
  # users commonly have: 437 (US), 850 (Western Europe), 866 (Cyrillic), 932 (Japanese),
  # 936 (Simplified Chinese) and 65001 (UTF-8). The test CLI host switches its console to the given page.
  test:
    name: test (${{ matrix.runner }}${{ matrix.codepage && format(', code page {0}', matrix.codepage) || '' }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: macos-latest
          - { runner: windows-latest, codepage: 437 }
          - { runner: windows-latest, codepage: 850 }
          - { runner: windows-latest, codepage: 866 }
          - { runner: windows-latest, codepage: 932 }
          - { runner: windows-latest, codepage: 936 }
          - { runner: windows-latest, codepage: 65001 }
    env:
      ARGH_TEST_CONSOLE_CODEPAGE: ${{ matrix.codepage }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json
    - run: dotnet test -c Release --logger:GithubActions --logger:pretty
      name: Test

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - run: |
        git fetch --prune --unshallow --tags
        echo exit code $?
        git tag --list
    # The older runtimes run the framework tests (tests/Nullean.Argh.Tests.FrameworkHost); global.json still picks the 10.0 SDK.
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          3.1.x
          5.0.x
          6.0.x
          8.0.x
          10.0.x

    # .NET Core 3.1 and .NET 5 abort with "No usable version of libssl was found" without OpenSSL 1.1, which this
    # Ubuntu release no longer ships; Ubuntu 20.04's security repository still has it.
    - name: Install OpenSSL 1.1 for the netcoreapp3.1 and net5.0 test hosts
      run: |
        echo "deb http://security.ubuntu.com/ubuntu focal-security main" | sudo tee /etc/apt/sources.list.d/focal-security.list
        sudo apt-get update -q
        sudo apt-get install -y -q libssl1.1

    # Build the local Nullean.Make.Fs DLL (only needed while it isn't on NuGet yet;
    # once published, replace with #r "nuget: Nullean.Make.Fs" in build.fsx)
    - run: dotnet build src/Nullean.Make.Fs/Nullean.Make.Fs.fsproj -c Release
      name: Build Nullean.Make.Fs (local reference bootstrap)

    - run: ./build.fsx build -s
      name: Build
    - run: ./build.fsx test -s
      name: Test
      env:
        # Fail, rather than skip, any framework host whose runtime is missing.
        ARGH_REQUIRE_ALL_FRAMEWORKS: "1"
    - run: ./build.fsx schema validate -s
      name: Validate schema/argh-cli-schema.json is up to date
    - run: ./build.fsx pkg generate -s
      name: Generate local nuget packages
    - run: ./build.fsx pkg validate -s
      name: "Validate *.nupkg files that were created"
    - run: ./build.fsx generate-api-changes -s
      name: "Inspect public API changes"

    - name: Publish to GitHub Package Repository
      if: github.event_name == 'push' && startswith(github.ref, 'refs/heads')
      shell: bash
      run: |
        until dotnet nuget push 'build/output/*.nupkg' -s https://nuget.pkg.github.com/nullean/index.json -k ${{secrets.GITHUB_TOKEN}} --skip-duplicate --no-symbols; do echo "Retrying"; sleep 1; done;

    - run: ./build.fsx generate-release-notes -s
      name: Generate release notes for tag
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
    - run: ./build.fsx create-release-on-github -s --token ${{secrets.GITHUB_TOKEN}}
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
      name: Create or update release for tag on GitHub

    - run: dotnet nuget push 'build/output/*.nupkg' -k ${{secrets.NUGET_ORG_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      name: Release to nuget.org
      if: github.event_name == 'push' && startswith(github.ref, 'refs/tags')
